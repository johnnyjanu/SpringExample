<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>사용자 정보</title>
</head>
<body>
	<h2>사용자 정보</h2>
	
	<table border="1">
		<tr>
			<th>id</th>
			<td th:text="${user.id}"></td>
		</tr>
		<tr>
			<th>이름</th>
			<td th:text="${user.name}"></td>
		</tr>
		<tr>
			<th>생년월일</th>
			<td th:text="${user.yyyymmdd}"></td>
		</tr>
		<tr>
			<th>이메일</th>
			<td th:text="${user.email}"></td>
		</tr>
	</table>
</body>
</html>
